global_classes:
- strongili
- eimeria_spp
- fasciola
- eimeria_intricata
- calicophoron
- dictyocaulus
- nematodirus
- dicrocoelium
- metastrongili
- trichuris
- skrjabinema
- toxocara
- strongyloides
- moniezia_expansa
- moniezia_benedeni
- capillaria
- giardia
- ascaris
- ancylostoma
- trichuris_trichiuria
model:
  arch: yolov8n.yaml   # still the swift arch; the 260714 attempt used yolov8l and
                        # never finished a checkpoint on CPU — n is enough to see
                        # a real mAP trend, not for a production-quality model.
  imgsz: 640            # real microscopy eggs are small — keep full resolution.
federation:
  mode: async

  local_epochs: 3       # up from the 2-epoch smoke test
  batch_size: 8
  lr0: 0.0008
  warmup_steps: 20
  grad_clip: 10.0
  workers: 0
  device: cuda
  data_fraction: 0.15   # up from 0.05 — a bigger real slice per node
                        # (node_A~519, node_B~889, node_C~423, node_D~306 train imgs)
                        # while still finishing in well under an hour on this GPU.

  rounds: 5             # unused in async mode, kept for schema completeness

  async_node_cycles: 5           # 4 nodes x 5 cycles = 20 submissions
                                  # total epochs/node = 5 x 3 = 15
  staleness_alpha: 0.5
  max_concurrent_nodes: 1        # was 2 — the run1 attempt combining concurrency=2
                                  # with pseudo_label (a second, teacher, model doing
                                  # forward passes from a second thread on the same
                                  # GPU) hung after ~19 min with zero further progress
                                  # for 19+ hours: a likely PyTorch/CUDA multi-thread
                                  # deadlock, not a DAFYOLO logic bug. Serializing GPU
                                  # access removes that risk; async semantics (pull
                                  # before the semaphore, staleness tracking) still hold.

  eval_interval: 4                # once per "virtual round" (n_nodes) -> ~5 readings
                                  # across the run so we can see the mAP trend, not
                                  # just the final number.

  pseudo_label:
    enabled: true        # re-enabled now that the core loop + class isolation are
                        # confirmed working (see the smoke-test invariant check).
    start_round: 2
    conf_thresh: 0.6
    weight: 0.5

nodes:
- name: node_A
  data_yaml: data/kfm_250423/node_A/data.yaml
  owned_classes:
  - eimeria_spp
  - calicophoron
  - trichuris
  - moniezia_expansa
- name: node_B
  data_yaml: data/kfm_250423/node_B/data.yaml
  owned_classes:
  - fasciola
  - metastrongili
  - moniezia_benedeni
  - trichuris_trichiuria
- name: node_C
  data_yaml: data/kfm_250423/node_C/data.yaml
  owned_classes:
  - strongili
  - eimeria_intricata
  - dictyocaulus
  - nematodirus
  - dicrocoelium
  - skrjabinema
  - toxocara
  - strongyloides
  - capillaria
  - giardia
- name: node_D
  data_yaml: data/kfm_250423/node_D/data.yaml
  owned_classes:
  - ascaris
  - ancylostoma

output_dir: runs/kfm_250423_fed_260801_long
seed: 0
