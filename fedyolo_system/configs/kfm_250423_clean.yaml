# Corrected kfm_250423 federation config -- generated from the real dataset
# with --drop-classes bubble,dirt,dictyocaulus,skrjabinema,toxocara,capillaria,giardia
# (the last 5 have 0, 0, 0, 0, and 2 annotated instances respectively in the
# whole 15,766-file source dataset -- see the field report, section 4).
# 15 real, learnable classes remain, ranging 66-9104 instances each.
#
# Hyperparameters below reproduce the one run that actually worked
# (runs/kfm_250423_federation/, 2026-07-04, mAP50 0.303 federated / 0.446
# centralized) on this cleaned class list -- change one thing at a time from
# here rather than starting over, since nothing since that run has reproduced
# it. Regenerate this file (or hand-edit) if you re-run
# tools/split_dataset_into_nodes.py with a different --seed / --drop-classes.

global_classes:
  - strongili
  - eimeria_spp
  - fasciola
  - eimeria_intricata
  - calicophoron
  - nematodirus
  - dicrocoelium
  - metastrongili
  - trichuris
  - strongyloides
  - moniezia_expansa
  - moniezia_benedeni
  - ascaris
  - ancylostoma
  - trichuris_trichiuria

model:
  arch: yolov8s.yaml     # matches the 2026-07-04 run
  imgsz: 480              # matches the 2026-07-04 run -- try 640/960 as a
                          # follow-up ablation, not a first attempt (every
                          # higher-res run since has crashed or OOM'd before
                          # completing, see field report section 4)

federation:
  mode: sync              # matches the 2026-07-04 run (the async attempts
                          # since are the ones that mostly collapsed to 0)
  rounds: 20
  local_epochs: 5
  batch_size: 8
  lr0: 0.0008
  warmup_steps: 20
  grad_clip: 10.0
  workers: 0
  device: auto            # resolves per-machine at load time: CUDA if
                          # available, else Apple MPS, else CPU (both CUDA
                          # and MPS verified to work on this codebase -- see
                          # field report section 5). No edit needed to move
                          # this config between the remote GPU box and this
                          # Mac. Expect a 15-class / ~15,750-image run at
                          # 480px to take substantially longer than the 106s
                          # toy smoke test though -- size it down (fewer
                          # rounds, smaller batch, or federation.data_fraction)
                          # before committing to a full local run on a laptop.
  pseudo_label:
    enabled: true
    start_round: 5
    conf_thresh: 0.6
    weight: 0.5

nodes:
  - name: node_A
    data_yaml: data/kfm_250423_clean/node_A/data.yaml
    owned_classes: [eimeria_spp, calicophoron, trichuris, moniezia_expansa]

  - name: node_B
    data_yaml: data/kfm_250423_clean/node_B/data.yaml
    owned_classes: [fasciola, metastrongili, moniezia_benedeni, trichuris_trichiuria]

  - name: node_C
    data_yaml: data/kfm_250423_clean/node_C/data.yaml
    owned_classes: [strongili, eimeria_intricata, nematodirus, dicrocoelium, strongyloides]

  - name: node_D
    data_yaml: data/kfm_250423_clean/node_D/data.yaml
    owned_classes: [ascaris, ancylostoma]

output_dir: runs/kfm_250423_clean_federation
seed: 0
