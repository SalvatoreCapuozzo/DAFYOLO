global_classes:
- strongili
- eimeria_spp
- fasciola
- eimeria_intricata
- calicophoron
- dictyocaulus
- nematodirus
- dicrocoelium
- metastrongili
- trichuris
- skrjabinema
- toxocara
- strongyloides
- moniezia_expansa
- moniezia_benedeni
- capillaria
- giardia
- ascaris
- ancylostoma
- trichuris_trichiuria
model:
  arch: yolov8l.yaml
  imgsz: 640
federation:
  # ── mode selector ────────────────────────────────────────────────────────
  mode: async          # "sync"  → classic FedAvg barrier (FedServer)
                       # "async" → immediate delta aggregation (AsyncFedServer)
  # ── shared (both modes) ──────────────────────────────────────────────────
  local_epochs: 10      # training epochs per round (sync) or per cycle (async)
  batch_size: 4
  lr0: 0.0008
  warmup_steps: 20     # linear LR warmup at start of every round/cycle
  grad_clip: 10.0      # gradient-norm clipping (important for from-scratch training)
  workers: 0
  device: cpu          # set to "cuda" if GPU available

  # ── sync only (ignored when mode: async) ─────────────────────────────────
  rounds: 5            # federated rounds; total epochs/node = rounds × local_epochs

  # ── async only (ignored when mode: sync) ─────────────────────────────────
  async_node_cycles: 6          # pull→train→push cycles per node
                                # total submissions = n_nodes × async_node_cycles
                                # total epochs/node = async_node_cycles × local_epochs
  staleness_alpha: 0.5          # staleness discount: w = 1 / (1 + alpha × staleness)
                                # staleness = global_version_now − version_when_node_pulled
                                # 0.0 → ignore staleness (no discount)
                                # 1.0 → strong discount (halved weight at staleness=1)
  max_concurrent_nodes: 1
  pseudo_label:
    enabled: true
    start_round: 2     # sync: round index; async: per-node cycle index
    conf_thresh: 0.6
    weight: 0.5
nodes:
- name: node_A
  data_yaml: data/kfm_250423/node_A/data.yaml
  owned_classes:
  - eimeria_spp
  - calicophoron
  - trichuris
  - moniezia_expansa
- name: node_B
  data_yaml: data/kfm_250423/node_B/data.yaml
  owned_classes:
  - fasciola
  - metastrongili
  - moniezia_benedeni
  - trichuris_trichiuria
- name: node_C
  data_yaml: data/kfm_250423/node_C/data.yaml
  owned_classes:
  - strongili
  - eimeria_intricata
  - dictyocaulus
  - nematodirus
  - dicrocoelium
  - skrjabinema
  - toxocara
  - strongyloides
  - capillaria
  - giardia
- name: node_D
  data_yaml: data/kfm_250423/node_D/data.yaml
  owned_classes:
  - ascaris
  - ancylostoma
output_dir: runs/kfm_250423_fed_260706
seed: 0
