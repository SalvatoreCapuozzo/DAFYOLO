federation:
  async_node_cycles: 15
  balanced_fraction: 0.1
  batch_size: 8
  device: auto
  eval_interval: 2
  grad_clip: 10.0
  local_epochs: 2
  lr0: 0.0008
  max_concurrent_nodes: 1
  mode: sync
  pseudo_label:
    conf_thresh: 0.6
    enabled: false
    start_round: 5
    weight: 0.5
  rounds: 10
  staleness_alpha: 0.5
  warmup_steps: 20
  workers: 0
global_classes:
- strongili
- fasciola
- eimeria_intricata
- calicophoron
- nematodirus
- dicrocoelium
- metastrongili
- strongyloides
- moniezia_benedeni
- ascaris
- ancylostoma
- trichuris_trichiuria
model:
  arch: yolov8s.yaml
  imgsz: 480
nodes:
- data_yaml: data/kfm_250423_clean12/node_A/data.yaml
  name: node_A
  owned_classes:
  - eimeria_intricata
  - calicophoron
  - moniezia_benedeni
- data_yaml: data/kfm_250423_clean12/node_B/data.yaml
  name: node_B
  owned_classes:
  - fasciola
  - dicrocoelium
  - metastrongili
  - trichuris_trichiuria
- data_yaml: data/kfm_250423_clean12/node_C/data.yaml
  name: node_C
  owned_classes:
  - strongili
  - nematodirus
  - strongyloides
- data_yaml: data/kfm_250423_clean12/node_D/data.yaml
  name: node_D
  owned_classes:
  - ascaris
  - ancylostoma
output_dir: runs/kfm_250423_clean12_federation
seed: 0
