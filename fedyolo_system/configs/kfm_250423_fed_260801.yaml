global_classes:
- strongili
- eimeria_spp
- fasciola
- eimeria_intricata
- calicophoron
- dictyocaulus
- nematodirus
- dicrocoelium
- metastrongili
- trichuris
- skrjabinema
- toxocara
- strongyloides
- moniezia_expansa
- moniezia_benedeni
- capillaria
- giardia
- ascaris
- ancylostoma
- trichuris_trichiuria
model:
  arch: yolov8n.yaml   # smallest arch — swift mechanism check, not a quality run.
                        # bump to yolov8l.yaml (as in kfm_250423_fed_260714.yaml)
                        # once the async loop is confirmed working end-to-end.
  imgsz: 640            # kept high: real microscopy eggs are small, unlike the
                        # doc's >=256 convergence floor for synthetic shapes.
federation:
  # ── mode selector ────────────────────────────────────────────────────────
  mode: async

  # ── shared (both modes) ──────────────────────────────────────────────────
  local_epochs: 2       # was 10 — a couple of epochs/cycle is enough to see the
                        # loss move and aggregation take effect.
  batch_size: 8
  lr0: 0.0008
  warmup_steps: 20
  grad_clip: 10.0
  workers: 0
  device: cuda          # was cpu — GPU confirmed available on this machine
                        # (RTX 3080 Laptop, 8GB) and real data is thousands of
                        # images/node; CPU would make this run far from "swift".
  data_fraction: 0.05   # NEW — use ~5% of each node's real images (still ~100-300
                        # per node) so the whole smoke test finishes in minutes,
                        # not hours, while still training on genuine microscopy data.

  # ── sync only (ignored when mode: async) ─────────────────────────────────
  rounds: 5

  # ── async only (ignored when mode: sync) ─────────────────────────────────
  async_node_cycles: 3           # was 6 — 4 nodes × 3 cycles = 12 submissions,
                                  # enough to see version increments and staleness.
  staleness_alpha: 0.5
  max_concurrent_nodes: 2        # was 1 — exercise genuine concurrent pull/train/push
                                  # on this multi-core/GPU machine, not just sequential
                                  # execution with async bookkeeping.

  # only evaluate once, at the very end — the pooled val set is ~3.5k real images
  # and a mid-run full Ultralytics val() pass would dominate wall-clock time here.
  eval_interval: 100

  pseudo_label:
    enabled: false      # disabled for this first swift pass (adds a teacher forward
                        # pass + distillation loss per batch); re-enable once the
                        # core pull/train/push/aggregate loop is confirmed working.
    start_round: 2
    conf_thresh: 0.6
    weight: 0.5

nodes:
- name: node_A
  data_yaml: data/kfm_250423/node_A/data.yaml
  owned_classes:
  - eimeria_spp
  - calicophoron
  - trichuris
  - moniezia_expansa
- name: node_B
  data_yaml: data/kfm_250423/node_B/data.yaml
  owned_classes:
  - fasciola
  - metastrongili
  - moniezia_benedeni
  - trichuris_trichiuria
- name: node_C
  data_yaml: data/kfm_250423/node_C/data.yaml
  owned_classes:
  - strongili
  - eimeria_intricata
  - dictyocaulus
  - nematodirus
  - dicrocoelium
  - skrjabinema
  - toxocara
  - strongyloides
  - capillaria
  - giardia
- name: node_D
  data_yaml: data/kfm_250423/node_D/data.yaml
  owned_classes:
  - ascaris
  - ancylostoma

# output_dir is a FAMILY folder now — simulate.py nests each run under
# output_dir/session_<timestamp>/ (or --session <name>) so repeated runs of
# this config never overwrite each other's checkpoints. See output_dir/latest.
output_dir: runs/kfm_250423_fed_260801
seed: 0
