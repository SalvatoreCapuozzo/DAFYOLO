global_classes:
- strongili
- eimeria_spp
- fasciola
- eimeria_intricata
- calicophoron
- dictyocaulus
- nematodirus
- dicrocoelium
- metastrongili
- trichuris
- skrjabinema
- toxocara
- strongyloides
- moniezia_expansa
- moniezia_benedeni
- capillaria
- giardia
- ascaris
- ancylostoma
- trichuris_trichiuria
model:
  arch: yolov8n.yaml
  imgsz: 640
federation:
  mode: async           # only used for its shared hyperparams here -- the
                        # actual cycle count/stopping is driven by target_run
                        # below, not federation.async_node_cycles directly.
  local_epochs: 1        # finest granularity: one epoch per cycle, so eval
                        # (and the live mAP display) refreshes as often as
                        # possible given optimizer momentum now persists
                        # across cycles (no cold-restart penalty to amortize).
  batch_size: 8
  lr0: 0.0008
  warmup_steps: 20
  grad_clip: 10.0
  workers: 0
  device: cuda
  data_fraction: 1.0    # full real dataset, all 4 nodes
  rounds: 5              # unused (async mode), kept for schema completeness
  async_node_cycles: 1   # overwritten at runtime by target_run.federated_max_cycles
  staleness_alpha: 0.5
  max_concurrent_nodes: 1   # kept serial -- see earlier hang with concurrency=2 + pseudo_label
  eval_interval: 4          # overwritten at runtime by target_run.eval_every_submissions
  pseudo_label:
    enabled: true
    start_round: 2
    conf_thresh: 0.6
    weight: 0.5

# Read only by fedyolo.simulate_to_target (ignored by fedyolo.simulate)
target_run:
  target_map: 0.80
  target_metric: map50       # mAP50, not mAP50-95 -- 0.80 on mAP50-95 would be
                              # essentially unreachable for a 20-class detector
                              # this data-constrained; see the per-class report
                              # printed at the start of the run for why.
  eval_every_epochs: 1        # centralized: evaluate every epoch (one full
                              # pass over all 4 nodes)
  eval_every_submissions: 4   # federated: evaluate once per "virtual round"
                              # (n_nodes submissions) -- same granularity as
                              # centralized's per-epoch eval, for a fair
                              # apples-to-apples trajectory comparison.
  centralized_max_epochs: 25  # safety cap, phase 1 (~25 x 13min/epoch-equiv
                              # empirically observed => ~5.5h worst case)
  federated_max_cycles: 25    # safety cap per node, phase 2 (~5.5h worst case)
  federated_patience: 6       # stop federated early after 6 evals
                              # (~6 virtual rounds) with no real improvement
  min_improvement: 0.002

nodes:
- name: node_A
  data_yaml: data/kfm_250423/node_A/data.yaml
  owned_classes:
  - eimeria_spp
  - calicophoron
  - trichuris
  - moniezia_expansa
- name: node_B
  data_yaml: data/kfm_250423/node_B/data.yaml
  owned_classes:
  - fasciola
  - metastrongili
  - moniezia_benedeni
  - trichuris_trichiuria
- name: node_C
  data_yaml: data/kfm_250423/node_C/data.yaml
  owned_classes:
  - strongili
  - eimeria_intricata
  - dictyocaulus
  - nematodirus
  - dicrocoelium
  - skrjabinema
  - toxocara
  - strongyloides
  - capillaria
  - giardia
- name: node_D
  data_yaml: data/kfm_250423/node_D/data.yaml
  owned_classes:
  - ascaris
  - ancylostoma

output_dir: runs/kfm_250423_target_map
seed: 0
