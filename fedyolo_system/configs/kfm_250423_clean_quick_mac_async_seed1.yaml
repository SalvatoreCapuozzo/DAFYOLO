# Verification of config B (async, seed 0, field report §5): same recipe,
# seed 1, and this time WITH --also-centralized -- the original async run
# skipped it since sync/async doesn't change centralized.py's training, but
# a matched pair is needed before trusting async's 0.358 mAP50 result.
federation:
  balanced_fraction: 0.1
  batch_size: 8
  device: auto
  eval_interval: 4
  grad_clip: 10.0
  local_epochs: 2
  lr0: 0.0008
  mode: async
  pseudo_label:
    conf_thresh: 0.6
    enabled: false
    start_round: 5
    weight: 0.5
  warmup_steps: 20
  workers: 0
  async_node_cycles: 5
global_classes:
- strongili
- eimeria_spp
- fasciola
- eimeria_intricata
- calicophoron
- nematodirus
- dicrocoelium
- metastrongili
- trichuris
- strongyloides
- moniezia_expansa
- moniezia_benedeni
- ascaris
- ancylostoma
- trichuris_trichiuria
model:
  arch: yolov8s.yaml
  imgsz: 480
nodes:
- data_yaml: data/kfm_250423_clean/node_A/data.yaml
  name: node_A
  owned_classes:
  - eimeria_spp
  - calicophoron
  - trichuris
  - moniezia_expansa
- data_yaml: data/kfm_250423_clean/node_B/data.yaml
  name: node_B
  owned_classes:
  - fasciola
  - metastrongili
  - moniezia_benedeni
  - trichuris_trichiuria
- data_yaml: data/kfm_250423_clean/node_C/data.yaml
  name: node_C
  owned_classes:
  - strongili
  - eimeria_intricata
  - nematodirus
  - dicrocoelium
  - strongyloides
- data_yaml: data/kfm_250423_clean/node_D/data.yaml
  name: node_D
  owned_classes:
  - ascaris
  - ancylostoma
output_dir: runs/kfm_250423_clean_federation
seed: 1
