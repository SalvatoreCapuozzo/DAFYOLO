global_classes:
  - ascaris
  - trichuris
  - hookworm

model:
  arch: yolov8n.yaml   # random (blank) weight init -- no pretrained checkpoint is loaded
  imgsz: 256

federation:
  rounds: 4
  local_epochs: 40
  batch_size: 4
  lr0: 0.0008
  warmup_steps: 20
  grad_clip: 10.0
  workers: 0
  device: cpu
  pseudo_label:
    enabled: true
    start_round: 2        # let the global model warm up before trusting its own pseudo-labels
    conf_thresh: 0.6
    weight: 0.5

nodes:
  - name: node_A
    data_yaml: data/synthetic/node_A/data.yaml
    owned_classes: [ascaris, trichuris]
  - name: node_B
    data_yaml: data/synthetic/node_B/data.yaml
    owned_classes: [hookworm]
  - name: node_C
    data_yaml: data/synthetic/node_C/data.yaml
    owned_classes: [ascaris, hookworm]

output_dir: runs/example_federation
seed: 0
