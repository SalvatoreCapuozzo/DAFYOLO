global_classes:
  - ascaris
  - trichuris
  - hookworm

model:
  arch: yolov8n.yaml   # Ultralytics architecture yaml
  imgsz: 256           # input resolution; keep >=256 for small objects (see README)
  pretrained: false    # blank/random init end to end, matching this file's documented,
                        # fully-offline quickstart (no COCO checkpoint download needed).
                        # model.pretrained defaults to true in fedyolo/config.py, which
                        # instead initializes the SHARED backbone/neck/box-head from the
                        # arch's official COCO checkpoint (downloaded on first use) --
                        # set this to true (or delete the line) once you have network
                        # access and want that warm start.

federation:
  # ── mode selector ────────────────────────────────────────────────────────
  mode: async          # "sync"  → classic FedAvg barrier (FedServer)
                       # "async" → immediate delta aggregation (AsyncFedServer)

  # ── shared (both modes) ──────────────────────────────────────────────────
  local_epochs: 5      # training epochs per round (sync) or per cycle (async)
  batch_size: 4
  lr0: 0.0008
  warmup_steps: 20     # linear LR warmup at start of every round/cycle
  grad_clip: 10.0      # gradient-norm clipping (important for from-scratch training)
  workers: 0
  device: auto         # resolves per-machine at load time: CUDA if available, else
                       # Apple MPS, else CPU -- both CUDA and MPS verified to run this
                       # config. Set an explicit "cuda"/"mps"/"cpu" instead to pin it.

  # ── sync only (ignored when mode: async) ─────────────────────────────────
  rounds: 4            # federated rounds; total epochs/node = rounds × local_epochs

  # ── async only (ignored when mode: sync) ─────────────────────────────────
  async_node_cycles: 6          # pull→train→push cycles per node
                                # total submissions = n_nodes × async_node_cycles
                                # total epochs/node = async_node_cycles × local_epochs
  staleness_alpha: 0.5          # staleness discount: w = 1 / (1 + alpha × staleness)
                                # staleness = global_version_now − version_when_node_pulled
                                # 0.0 → ignore staleness (no discount)
                                # 1.0 → strong discount (halved weight at staleness=1)

  pseudo_label:
    enabled: true
    start_round: 2     # sync: round index; async: per-node cycle index
    conf_thresh: 0.6
    weight: 0.5

nodes:
  - name: node_A
    data_yaml: data/synthetic/node_A/data.yaml
    owned_classes: [ascaris, trichuris]   # local label 0→ascaris, 1→trichuris

  - name: node_B
    data_yaml: data/synthetic/node_B/data.yaml
    owned_classes: [hookworm]             # local label 0→hookworm

  - name: node_C
    data_yaml: data/synthetic/node_C/data.yaml
    owned_classes: [ascaris, hookworm]    # local label 0→ascaris, 1→hookworm

output_dir: runs/example_federation
seed: 0
