# Fast local-iteration variant of kfm_250423_clean.yaml, for running actual
# attempts on a laptop (no discrete GPU) in tens of minutes instead of
# hours. Goal here is checking the federated/centralized GAP, not maximizing
# mAP -- see the field report's real-data section. Same 15-class cleaned
# dataset and node layout as kfm_250423_clean.yaml; three things changed:
#   1. balanced_fraction: 0.10 -- class-stratified ~10% subset (every class
#      keeps at least 1 image, not a naive prefix slice -- see fedyolo/sampling.py)
#   2. rounds/local_epochs cut down from 20x5 to 5x2 (10 vs 100 epochs/node)
#   3. device: auto (resolves to mps on this Mac automatically)
# Calibrated once on this machine (M2 Pro): ~110-115s/round at local_epochs=1,
# yolov8s@480, balanced_fraction=0.10 -- size further attempts from that.

global_classes:
  - strongili
  - eimeria_spp
  - fasciola
  - eimeria_intricata
  - calicophoron
  - nematodirus
  - dicrocoelium
  - metastrongili
  - trichuris
  - strongyloides
  - moniezia_expansa
  - moniezia_benedeni
  - ascaris
  - ancylostoma
  - trichuris_trichiuria

model:
  arch: yolov8s.yaml
  imgsz: 480

federation:
  mode: sync
  rounds: 5
  local_epochs: 2
  balanced_fraction: 0.10
  batch_size: 8
  lr0: 0.0008
  warmup_steps: 20
  grad_clip: 10.0
  workers: 0
  device: auto
  eval_interval: 1
  pseudo_label:
    enabled: true
    start_round: 5   # NOTE: with rounds: 5 above (round_idx 0..4), this
                     # condition (round_idx >= start_round) never fires --
                     # pseudo-labeling was effectively OFF for the seed0/seed1
                     # runs reported against this file, despite enabled:true.
                     # Left as-is so this file still reproduces those results
                     # exactly; see kfm_250423_clean_quick_mac_pl.yaml for the
                     # fixed version actually used to test pseudo-labeling.
    conf_thresh: 0.6
    weight: 0.5

nodes:
  - name: node_A
    data_yaml: data/kfm_250423_clean/node_A/data.yaml
    owned_classes: [eimeria_spp, calicophoron, trichuris, moniezia_expansa]

  - name: node_B
    data_yaml: data/kfm_250423_clean/node_B/data.yaml
    owned_classes: [fasciola, metastrongili, moniezia_benedeni, trichuris_trichiuria]

  - name: node_C
    data_yaml: data/kfm_250423_clean/node_C/data.yaml
    owned_classes: [strongili, eimeria_intricata, nematodirus, dicrocoelium, strongyloides]

  - name: node_D
    data_yaml: data/kfm_250423_clean/node_D/data.yaml
    owned_classes: [ascaris, ancylostoma]

output_dir: runs/kfm_250423_clean_federation
seed: 0
