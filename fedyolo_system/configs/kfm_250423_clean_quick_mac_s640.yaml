# Bigger-input test: same as kfm_250423_clean_quick_mac.yaml (sync,
# yolov8s, balanced 10%, seed 0) except imgsz: 640 (was 480). Calibrated at
# ~285s/round-equivalent (1 round x 1 local_epoch) on this Mac before
# launching -- ~47min federated + ~47min centralized at the full 5x2 budget.
federation:
  balanced_fraction: 0.1
  batch_size: 8
  device: auto
  eval_interval: 1
  grad_clip: 10.0
  local_epochs: 2
  lr0: 0.0008
  mode: sync
  pseudo_label:
    conf_thresh: 0.6
    enabled: false
    start_round: 5
    weight: 0.5
  rounds: 5
  warmup_steps: 20
  workers: 0
global_classes:
- strongili
- eimeria_spp
- fasciola
- eimeria_intricata
- calicophoron
- nematodirus
- dicrocoelium
- metastrongili
- trichuris
- strongyloides
- moniezia_expansa
- moniezia_benedeni
- ascaris
- ancylostoma
- trichuris_trichiuria
model:
  arch: yolov8s.yaml
  imgsz: 640
nodes:
- data_yaml: data/kfm_250423_clean/node_A/data.yaml
  name: node_A
  owned_classes:
  - eimeria_spp
  - calicophoron
  - trichuris
  - moniezia_expansa
- data_yaml: data/kfm_250423_clean/node_B/data.yaml
  name: node_B
  owned_classes:
  - fasciola
  - metastrongili
  - moniezia_benedeni
  - trichuris_trichiuria
- data_yaml: data/kfm_250423_clean/node_C/data.yaml
  name: node_C
  owned_classes:
  - strongili
  - eimeria_intricata
  - nematodirus
  - dicrocoelium
  - strongyloides
- data_yaml: data/kfm_250423_clean/node_D/data.yaml
  name: node_D
  owned_classes:
  - ascaris
  - ancylostoma
output_dir: runs/kfm_250423_clean_federation
seed: 0
